name: Build Android App (APK & AAB)

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Format to build (نوع خروجی: apk یا aab یا both)'
        required: true
        default: 'apk'
        type: choice
        options:
          - 'apk'
          - 'aab'
          - 'both'
      build_variant:
        description: 'Variant (نسخه ریلیز یا دیباگ)'
        required: true
        default: 'release'
        type: choice
        options:
          - 'release'
          - 'debug'

jobs:
  build-android-native:
    name: 🤖 Build Android Native (APK / AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'
      VITE_GA_MEASUREMENT_ID: ${{ secrets.VITE_GA_MEASUREMENT_ID || vars.VITE_GA_MEASUREMENT_ID }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || vars.SUPABASE_SERVICE_ROLE_KEY }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY || vars.VITE_CLERK_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY || vars.VITE_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY || vars.CLERK_SECRET_KEY }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 📱 Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🥟 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 📦 Install Dependencies
        run: |
          bun install

      - name: 📝 Configure Environment (.env)
        run: |
          cat << 'EOF' > .env
          VITE_GA_MEASUREMENT_ID=${{ env.VITE_GA_MEASUREMENT_ID }}
          VITE_SUPABASE_URL=${{ env.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ env.VITE_SUPABASE_ANON_KEY }}
          SUPABASE_URL=${{ env.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ env.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          VITE_CLERK_PUBLISHABLE_KEY=${{ env.VITE_CLERK_PUBLISHABLE_KEY }}
          EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ env.EXPO_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY=${{ env.CLERK_SECRET_KEY }}
          EOF

      - name: 📦 Pre-bundle JavaScript & Assets
        run: |
          mkdir -p android/app/src/main/assets
          bun x expo export:embed --platform android --dev false --entry-file index.js --bundle-output android/app/src/main/assets/index.android.bundle --assets-dest android/app/src/main/res

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🔑 Ensure Gradle Permissions
        run: |
          chmod +x android/gradlew

      - name: 🔑 Ensure Keystore
        run: |
          if [ ! -f "android/app/debug.keystore" ]; then
            echo "Generating debug.keystore..."
            keytool -genkey -v -keystore android/app/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: 🚀 Build Android APK (Release)
        if: ${{ github.event_name == 'push' || (github.event.inputs.build_variant != 'debug' && (github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == 'both')) }}
        working-directory: android
        run: |
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: 🛠️ Build Android APK (Debug)
        if: ${{ github.event.inputs.build_variant == 'debug' && (github.event.inputs.build_type == 'apk' || github.event.inputs.build_type == 'both') }}
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: 📦 Build Android App Bundle (AAB for Stores)
        if: ${{ github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == 'both' }}
        working-directory: android
        run: |
          ./gradlew bundleRelease --no-daemon --stacktrace

      - name: 🔍 List Generated Artifacts
        run: |
          echo "=== APK Files ==="
          find android/app/build/outputs/apk -name "*.apk" || echo "No APK found"
          echo "=== Bundle Files ==="
          find android/app/build/outputs/bundle -name "*.aab" || echo "No AAB found"

      - name: 📤 Upload APK Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: abyar-water-tracker-apk
          path: |
            android/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: 📤 Upload AAB Artifact
        if: ${{ github.event.inputs.build_type == 'aab' || github.event.inputs.build_type == 'both' }}
        uses: actions/upload-artifact@v4
        with:
          name: abyar-water-tracker-aab
          path: |
            android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: warn
          retention-days: 30

      - name: 📝 Generate Build Summary
        if: always()
        run: |
          echo "### 🚀 نتیجه بیلد اندروید آب‌یار (Abyar Android Build)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "بیلد اندروید با موفقیت توسط گیت‌هاب اکشنز اجرا شد." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**فایل‌های خروجی در بخش Artifacts همین صفحه قرار دارند:**" >> $GITHUB_STEP_SUMMARY
          echo "- 📱 **abyar-water-tracker-apk**: فایل نصبی مستقیم جهت انتقال و نصب روی گوشی اندروید" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 **abyar-water-tracker-aab**: بسته انتشار جهت آپلود در کافه بازار، مایکت یا گوگل‌پلی" >> $GITHUB_STEP_SUMMARY

